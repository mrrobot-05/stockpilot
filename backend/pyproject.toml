[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot"
version = "0.1.0"
description = "StockPilot inventory management API and UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aditya Kale", email = "adityakale5002@gmail.com" }]
license = { text = "MIT" }
keywords = ["inventory", "stock", "fastapi", "sqlalchemy", "bootstrap", "htmx", "sqlite"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/mrrobot-05/stockpilot"
Repository = "https://github.com/mrrobot-05/stockpilot"
Issues = "https://github.com/mrrobot-05/stockpilot/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using httpx with starlette.testclient is deprecated:DeprecationWarning",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
