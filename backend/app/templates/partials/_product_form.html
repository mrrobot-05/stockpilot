<div
  class="modal fade"
  id="productFormModal"
  tabindex="-1"
  aria-labelledby="productFormModalTitle"
  aria-modal="true"
  role="dialog"
>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form hx-post="{{ form_action }}" hx-target="#modal-root" hx-swap="innerHTML">
        <div class="modal-header">
          <h2 class="modal-title h5" id="productFormModalTitle">{{ modal_title }}</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {% if error %}
            <div class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>{{ error }}
            </div>
          {% endif %}

          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <label class="form-label sp-label" for="product-form-sku">SKU *</label>
              <input class="form-control" id="product-form-sku" name="sku" required
                maxlength="64" value="{{ values.sku or '' }}" />
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label sp-label" for="product-form-name">Name *</label>
              <input class="form-control" id="product-form-name" name="name" required
                maxlength="200" value="{{ values.name or '' }}" />
            </div>
            <div class="col-12">
              <label class="form-label sp-label" for="product-form-description">Description</label>
              <textarea class="form-control" id="product-form-description" name="description"
                rows="2" maxlength="2000">{{ values.description or '' }}</textarea>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label sp-label" for="product-form-category">Category</label>
              <select class="form-select" id="product-form-category" name="category_id">
                <option value="" {% if values.category_id is none %}selected{% endif %}>None</option>
                {% for category in categories %}
                  <option value="{{ category.id }}" {% if values.category_id == category.id %}selected{% endif %}>
                    {{ category.name }}
                  </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label sp-label" for="product-form-supplier">Supplier</label>
              <select class="form-select" id="product-form-supplier" name="supplier_id">
                <option value="" {% if values.supplier_id is none %}selected{% endif %}>None</option>
                {% for supplier in suppliers %}
                  <option value="{{ supplier.id }}" {% if values.supplier_id == supplier.id %}selected{% endif %}>
                    {{ supplier.name }}
                  </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-6 col-lg-3">
              <label class="form-label sp-label" for="product-form-cost">Cost price</label>
              <input class="form-control" type="number" step="0.01" min="0" id="product-form-cost"
                name="cost_price" value="{{ values.cost_price }}" />
            </div>
            <div class="col-6 col-lg-3">
              <label class="form-label sp-label" for="product-form-price">Sell price</label>
              <input class="form-control" type="number" step="0.01" min="0" id="product-form-price"
                name="sell_price" value="{{ values.sell_price }}" />
            </div>
            {% if not is_edit %}
              <div class="col-6 col-lg-3">
                <label class="form-label sp-label" for="product-form-quantity">Opening stock</label>
                <input class="form-control" type="number" step="1" min="0" id="product-form-quantity"
                  name="quantity" value="{{ values.quantity }}" />
              </div>
            {% endif %}
            <div class="col-6 col-lg-3">
              <label class="form-label sp-label" for="product-form-reorder">Reorder level</label>
              <input class="form-control" type="number" step="1" min="0" id="product-form-reorder"
                name="reorder_level" value="{{ values.reorder_level }}" />
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="product-form-active"
                  name="is_active" value="on" {% if values.is_active %}checked{% endif %} />
                <label class="form-check-label" for="product-form-active">Active product</label>
              </div>
            </div>
            {% if is_edit %}
              <div class="col-12">
                <p class="small text-body-secondary mb-0">
                  <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
                  Stock quantity is managed through stock movements, not here.
                </p>
              </div>
            {% endif %}
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check2 me-1" aria-hidden="true"></i>{{ 'Save changes' if is_edit else 'Add product' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
