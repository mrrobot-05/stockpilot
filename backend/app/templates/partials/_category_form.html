<div
  class="modal fade"
  id="categoryFormModal"
  tabindex="-1"
  aria-labelledby="categoryFormModalTitle"
  aria-modal="true"
  role="dialog"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form hx-post="{{ form_action }}" hx-target="#modal-root" hx-swap="innerHTML">
        <div class="modal-header">
          <h2 class="modal-title h5" id="categoryFormModalTitle">{{ modal_title }}</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {% if error %}
            <div class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>{{ error }}
            </div>
          {% endif %}
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label sp-label" for="category-form-name">Name *</label>
              <input class="form-control" id="category-form-name" name="name" required
                maxlength="100" value="{{ values.name or '' }}" />
            </div>
            <div class="col-12">
              <label class="form-label sp-label" for="category-form-description">Description</label>
              <textarea class="form-control" id="category-form-description" name="description"
                rows="3" maxlength="500">{{ values.description or '' }}</textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check2 me-1" aria-hidden="true"></i>{{ 'Save changes' if is_edit else 'Add category' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
