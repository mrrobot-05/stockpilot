{% extends "base.html" %}

{% block content %}
  <div class="card sp-card sp-placeholder mx-auto">
    <div class="card-body text-center py-5">
      <span class="sp-empty-icon" aria-hidden="true"><i class="bi {{ page_icon }}"></i></span>
      <h2 class="h3 mt-3">{{ page_title }}</h2>
      <p class="text-body-secondary mx-auto sp-empty-copy">
        This screen arrives in the next implementation step. The JSON API is already available
        if you want to explore the data today.
      </p>
      <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
        <a class="btn btn-primary" href="/docs">
          <i class="bi bi-braces me-1" aria-hidden="true"></i>Open API docs
        </a>
        <a class="btn btn-outline-secondary" href="/dashboard">
          <i class="bi bi-grid-1x2 me-1" aria-hidden="true"></i>Back to dashboard
        </a>
      </div>
    </div>
  </div>
{% endblock %}
