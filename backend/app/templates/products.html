{% extends "base.html" %}

{% block content %}
  <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
    <div>
      <h2 class="h3 mb-1">Products</h2>
      <p class="text-body-secondary mb-0">
        Search, filter and review your catalogue and stock levels.
      </p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-outline-secondary" href="/api/export/products.csv">
        <i class="bi bi-download me-1" aria-hidden="true"></i>Export CSV
      </a>
      <a class="btn btn-outline-secondary" href="/dashboard">
        <i class="bi bi-grid-1x2 me-1" aria-hidden="true"></i>Dashboard
      </a>
    </div>
  </div>

  <form
    class="card sp-card sp-filter mb-4"
    role="search"
    hx-get="/products"
    hx-target="#product-table"
    hx-swap="outerHTML"
    hx-push-url="true"
  >
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-4">
          <label class="form-label sp-label" for="product-search">Search</label>
          <input
            class="form-control"
            type="search"
            id="product-search"
            name="q"
            value="{{ q }}"
            placeholder="SKU, name or description"
          />
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <label class="form-label sp-label" for="category-filter">Category</label>
          <select class="form-select" id="category-filter" name="category_id">
            <option value="" {% if category_id is none %}selected{% endif %}>All categories</option>
            {% for category in categories %}
              <option value="{{ category.id }}" {% if category_id == category.id %}selected{% endif %}>
                {{ category.name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <label class="form-label sp-label" for="supplier-filter">Supplier</label>
          <select class="form-select" id="supplier-filter" name="supplier_id">
            <option value="" {% if supplier_id is none %}selected{% endif %}>All suppliers</option>
            {% for supplier in suppliers %}
              <option value="{{ supplier.id }}" {% if supplier_id == supplier.id %}selected{% endif %}>
                {{ supplier.name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12 col-sm-6 col-lg-2">
          <label class="form-label sp-label" for="status-filter">Status</label>
          <select class="form-select" id="status-filter" name="is_active">
            <option value="" {% if is_active is none %}selected{% endif %}>Any</option>
            <option value="true" {% if is_active is sameas true %}selected{% endif %}>Active</option>
            <option value="false" {% if is_active is sameas false %}selected{% endif %}>Inactive</option>
          </select>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="form-check ps-0 pt-sm-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="low-stock-filter"
              name="low_stock"
              value="true"
              {% if low_stock %}checked{% endif %}
            />
            <label class="form-check-label sp-label" for="low-stock-filter">
              Low stock only
            </label>
          </div>
        </div>
        <div class="col-12 col-lg-8 d-flex flex-wrap gap-2 align-items-end justify-content-lg-end">
          <input type="hidden" name="page" value="1" />
          <input type="hidden" name="page_size" value="{{ page_size }}" />
          <input type="hidden" name="sort" value="{{ sort }}" />
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-funnel me-1" aria-hidden="true"></i>Apply filters
          </button>
          <a class="btn btn-outline-secondary" href="/products">Clear</a>
        </div>
      </div>
    </div>
  </form>

  {% include "partials/_product_table.html" %}
{% endblock %}
