{% extends "base.html" %}

{% block content %}
  <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
    <div>
      <h2 class="h3 mb-1">Suppliers</h2>
      <p class="text-body-secondary mb-0">
        Keep vendor contacts and the products they supply in one place.
      </p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="button"
        hx-get="/suppliers/new" hx-target="#modal-root" hx-swap="innerHTML">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add supplier
      </button>
      <a class="btn btn-outline-secondary" href="/products">
        <i class="bi bi-box-seam me-1" aria-hidden="true"></i>Products
      </a>
    </div>
  </div>

  <form
    class="card sp-card sp-filter mb-4"
    role="search"
    hx-get="/suppliers"
    hx-target="#supplier-table"
    hx-swap="outerHTML"
    hx-push-url="true"
  >
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-6">
          <label class="form-label sp-label" for="supplier-search">Search</label>
          <input class="form-control" type="search" id="supplier-search" name="q"
            value="{{ q }}" placeholder="Name, contact, email or phone" />
        </div>
        <div class="col-12 col-lg-6 d-flex flex-wrap gap-2 align-items-end justify-content-lg-end">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-funnel me-1" aria-hidden="true"></i>Apply filters
          </button>
          <a class="btn btn-outline-secondary" href="/suppliers">Clear</a>
        </div>
      </div>
    </div>
  </form>

  {% include "partials/_supplier_table.html" %}
  <div id="modal-root"></div>
{% endblock %}
